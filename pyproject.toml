[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smartanalyticsinvest"
version = "0.1.0"
description = "Deterministic local OHLCV CSV analytics toolkit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
market-data = [
    "yfinance",
]

[project.scripts]
smartanalyticsinvest = "smartanalyticsinvest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks/*.ipynb"]
