[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smartanalyticsinvest"
version = "0.1.0"
description = "Deterministic local OHLCV CSV analytics toolkit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
