[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smartanalyticsinvest"
version = "0.1.1"
description = "Deterministic local OHLCV CSV analytics toolkit."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [
    { name = "Jorge" },
]
keywords = [
    "analytics",
    "csv",
    "finance",
    "ohlcv",
    "technical-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pandas-stubs",
    "pyarrow",
]
market-data = [
    "yfinance",
]
file-formats = [
    "pyarrow",
]

[project.scripts]
smartanalyticsinvest = "smartanalyticsinvest.cli:main"

[project.urls]
Repository = "https://github.com/dreamjorge/SmartAnalyticsInvest"
Changelog = "https://github.com/dreamjorge/SmartAnalyticsInvest/blob/main/CHANGELOG.md"
Issues = "https://github.com/dreamjorge/SmartAnalyticsInvest/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
